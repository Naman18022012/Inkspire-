<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKSPIRE | Presidency School Banashankari</title>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#001224">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-crest"><i class="fa-solid fa-feather-pointed"></i></div>
    <div class="loader-title">INKSPIRE</div>
    <div style="font-family: var(--font-accent); font-size: 0.75rem; letter-spacing: 2px; color: var(--color-accent-gold);">PRESIDENCY BANASHANKARI</div>
    <div class="loader-bar-bg">
      <div id="loader-bar-fill" class="loader-bar-fill"></div>
    </div>
  </div>

  <!-- Header Navigation -->
  <header class="header-nav">
    <div class="header-container">
      <a href="#" class="brand-group">
        <img src="https://presidencyschoolbsk.org/wp-content/uploads/2025/02/PSBSK.webp" alt="Presidency BSK Logo" class="brand-logo-img">
        <div class="brand-text-block">
          <span class="brand-inkspire">INKSPIRE</span>
          <span class="brand-subtext">PRESIDENCY BANASHANKARI</span>
        </div>
      </a>

      <div class="nav-actions">
        <button id="btn-open-toc" class="btn-icon" title="Table of Contents">
          <i class="fa-solid fa-list-ul"></i>
        </button>
        <button class="btn-icon" title="Share Publication" onclick="navigator.clipboard.writeText(window.location.href); alert('Publication link copied!');">
          <i class="fa-solid fa-share-nodes"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 3D Magazine Stage -->
  <main class="magazine-hero-stage">
    <div class="stage-header">
      <div class="edition-badge">
        <i class="fa-solid fa-sparkles"></i> VOL. IV • ISSUE 02 • AUGUST 2026
      </div>
      <h1 class="stage-title">Digital Publication Reader</h1>
    </div>

    <div class="magazine-viewport">
      <div id="magazine-book" class="magazine-book">
        <div id="page-base-left" class="page-base left"></div>
        <div class="spine-center"></div>
        <div id="page-base-right" class="page-base right"></div>
      </div>
    </div>

    <div class="magazine-controls">
      <button id="btn-prev" class="ctrl-btn">
        <i class="fa-solid fa-chevron-left"></i> Previous
      </button>
      <span id="page-counter-text" class="page-counter">Loading...</span>
      <button id="btn-next" class="ctrl-btn">
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </main>

  <!-- Table of Contents Drawer -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="toc-drawer" class="toc-drawer">
    <div class="drawer-header">
      <h3 style="font-family: var(--font-display); letter-spacing: 1px;">Table of Contents</h3>
      <button id="btn-close-toc" class="btn-icon" style="background: transparent; border: none;">
        <i class="fa-solid fa-xmark" style="font-size: 1.2rem;"></i>
      </button>
    </div>
    <ul id="toc-list-items" class="toc-list"></ul>
  </aside>

  <!-- External Script -->
  <script src="script.js"></script>
</body>
</html>
