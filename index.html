<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INKSPIRE | Presidency School Banashankari</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#001224">

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- PDF.js Styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- PDF.js and PageFlip Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="app-loader">
    <div class="loader-crest"><i class="fa-solid fa-feather-pointed"></i></div>
    <div class="loader-title">INKSPIRE</div>
    <div class="loader-subtitle">PRESIDENCY SCHOOL BANASHANKARI</div>
    <div class="loader-progress-track">
      <div id="loader-progress-bar" class="loader-progress-bar"></div>
    </div>
    <div id="loader-status" class="loader-status">Initializing PDF Engine...</div>
  </div>

  <!-- Compact Editorial Header -->
  <header class="reader-header">
    <div class="brand-block">
      <img src="https://presidencyschoolbsk.org/wp-content/uploads/2025/02/PSBSK.webp" alt="PSBSK Logo" class="brand-logo">
      <div class="brand-info">
        <span class="brand-title">INKSPIRE</span>
        <span class="brand-edition">VOL. IV • ISSUE 02</span>
      </div>
    </div>

    <!-- Quick Action Toolbar -->
    <div class="header-actions">
      <button id="btn-search-toggle" class="icon-btn" title="Search Document (Ctrl+F)">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <button id="btn-toc-toggle" class="icon-btn" title="Page Thumbnails & Contents">
        <i class="fa-solid fa-grip"></i>
      </button>
      <button id="btn-zoom-toggle" class="icon-btn" title="Toggle Fit / Zoom">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button id="btn-fullscreen-toggle" class="icon-btn" title="Fullscreen View (F)">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- MAIN PRODUCT: 3D MAGAZINE STAGE -->
  <main id="magazine-stage" class="magazine-stage">
    <div class="stage-viewport" id="stage-viewport">
      <div id="flipbook" class="flipbook-container">
        <!-- Canvas/HTML pages dynamically rendered here via PDF.js -->
      </div>
    </div>
  </main>

  <!-- Floating Minimal Control Dock -->
  <nav class="reader-dock">
    <button id="btn-prev-page" class="dock-btn" title="Previous Page (Left Arrow)">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    
    <div class="dock-page-jump">
      <span>Page</span>
      <input type="number" id="input-page-num" min="1" value="1" aria-label="Page Number">
      <span id="lbl-total-pages">of --</span>
    </div>

    <button id="btn-next-page" class="dock-btn" title="Next Page (Right Arrow)">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </nav>

  <!-- OVERLAY 1: Page Thumbnails & TOC Modal -->
  <div id="toc-overlay" class="overlay-backdrop">
    <div class="overlay-panel toc-panel">
      <div class="panel-header">
        <div>
          <h3>Table of Contents</h3>
          <p>Click any page preview to jump directly to it</p>
        </div>
        <button id="btn-close-toc" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="thumbnail-grid" class="thumbnail-grid">
        <!-- Rendered thumbnail canvases inserted dynamically -->
      </div>
    </div>
  </div>

  <!-- OVERLAY 2: Document Text Search Drawer -->
  <div id="search-overlay" class="overlay-backdrop">
    <div class="overlay-panel search-panel">
      <div class="panel-header">
        <h3>Search Publication</h3>
        <button id="btn-close-search" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-query-input" placeholder="Type keywords to search PDF content..." autofocus>
      </div>
      <div id="search-results-list" class="search-results-list">
        <div class="search-placeholder">Enter text above to search through all rendered PDF pages.</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
